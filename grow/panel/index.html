<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de avance · Sistema GROW</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--bg2:#141821;--card:#1b202b;--line:#2a3140;--txt:#f4f6fa;--mute:#9aa3b2;--accent:#2f8cff;--ok:#3ccf8e;--warn:#ffd23f;--bad:#ff7b7b}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
header{display:flex;align-items:center;gap:14px;padding:18px 4vw;border-bottom:1px solid var(--line);background:radial-gradient(60% 200% at 100% 0%,#1d4ed855,transparent)}
header img{height:38px}
.sep{width:1px;height:28px;background:var(--line)}
.logo{font-weight:900;letter-spacing:.04em;font-size:20px}.logo span{color:var(--accent)}
header small{color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-left:4px}
.hR{margin-left:auto;display:flex;gap:10px;align-items:center}
.b{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;font-weight:700;font-size:14px;border:1px solid #ffffff2e;text-decoration:none;color:inherit}
.b:hover{border-color:#fff}.b.w{background:#fff;color:#000;border-color:#fff}
main{padding:26px 4vw 60px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.kpi b{display:block;font-size:32px;font-weight:900;margin-top:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{background:#ffffff0d;border:1px solid #ffffff26;border-radius:8px;padding:10px 12px;outline:none}
.tools input{flex:1 1 240px}
.tools select{flex:0 0 auto}
.tools select option{background:#141821}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:1150px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
td{padding:12px 14px;border-bottom:1px solid #ffffff0d;vertical-align:middle}
tr:hover td{background:#ffffff05}
.name b{display:block}.name small{color:var(--mute)}
.name a{color:#7cc4ff;text-decoration:none;font-size:12px}
.prog{display:flex;align-items:center;gap:8px;min-width:140px}
.bar{flex:1;height:7px;border-radius:9px;background:#ffffff14;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok))}
.prog span{font-size:12px;color:var(--mute);white-space:nowrap}
.n{display:inline-block;min-width:44px;text-align:center;padding:3px 7px;border-radius:6px;font-weight:800;font-size:12px}
.n.ok{background:#3ccf8e26;color:var(--ok)}.n.no{background:#ff7b7b1f;color:var(--bad)}.n.na{background:#ffffff0d;color:#6b7383}
.cert{font-weight:700;color:var(--warn);white-space:nowrap}.cert.na{color:#6b7383;font-weight:500}
.muted{color:var(--mute);font-size:13px}
.gate{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:6vw}
.gBox{width:min(400px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:28px}
.gBox h1{font-size:24px;margin-bottom:6px}.gBox p{color:var(--mute);font-size:14px;margin-bottom:16px}
.gBox input{width:100%;background:#ffffff0d;border:1px solid #ffffff2e;border-radius:8px;padding:13px;font-size:20px;letter-spacing:.3em;text-align:center;outline:none}
.gBox .b{width:100%;justify-content:center;margin-top:12px;padding:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.empty{padding:40px;text-align:center;color:var(--mute)}

.cards{display:none}
.ac{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.ac .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.ac .top b{font-size:16px}.ac .top small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.ac .top a{color:#7cc4ff;font-size:12px;text-decoration:none;white-space:nowrap}
.ac .qs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.ac .qs div{text-align:center;font-size:10px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ac .qs .n{display:block;margin-top:4px;width:100%}
.ac .foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
@media (max-width:700px){
  header{flex-wrap:wrap;padding:14px 4vw;gap:10px}
  header .hR{margin-left:0;width:100%;}
  header .hR .b{flex:1;justify-content:center;padding:9px 8px;font-size:13px}
  main{padding:18px 4vw 50px}
  .kpis{gap:10px}.kpi{padding:12px 14px}.kpi b{font-size:26px}.kpi span{font-size:10.5px}
}
@media (max-width:1200px){.wrap{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.ac{margin:0}}

@media (max-width:800px){.kpis{grid-template-columns:1fr 1fr}header small{display:none}}
</style>
</head>
<body>
<header>
  <img src="../logo-skyone-home.png" alt="SkyOne Home"><span class="sep"></span>
  <div class="logo">SISTEMA <span>GROW</span><small>Panel de avance</small></div>
  <div class="hR" id="hR"></div>
</header>

<div class="gate" id="gate"><form class="gBox" id="gF">
  <h1>Panel del broker</h1>
  <p>Ingresá el PIN para ver el avance de los asesores.</p>
  <input id="pin" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••••" aria-label="PIN">
  <div class="err" id="gE"></div>
  <button class="b w" type="submit">Entrar</button>
</form></div>

<main id="app" hidden>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <input id="q" placeholder="Buscar asesor…">
    <select id="f"><option value="">Todos</option><option value="cert">Con certificado</option><option value="curso">En curso</option><option value="nada">Sin empezar</option></select>
  </div>
  <div class="wrap"><table><thead><tr>
    <th data-k="Asesor">Asesor</th><th data-k="Clases vistas">Clases</th>
    <th data-k="Mentalidad %">Mentalidad</th><th data-k="Captación %">Captación</th><th data-k="Clientes y comisiones %">Clientes</th><th data-k="Alquileres %">Alquileres</th><th data-k="Ventas %">Ventas</th><th data-k="Sistema %">Sistema</th>
    <th data-k="Cuestionarios aprobados">Aprobados</th><th data-k="Certificado">Certificado</th><th data-k="Último acceso">Último acceso</th>
  </tr></thead><tbody id="tb"></tbody></table></div>
  <div class="cards" id="cards"></div>
  <p class="muted" style="margin-top:12px">Se actualiza cada vez que un asesor ve una clase, rinde un cuestionario o descarga su certificado.</p>
</main>

<script>
const API="https://script.google.com/macros/s/AKfycbxtE205op2cUnn-jceR_vQYjKkDzu9NBY7PPgqZBYwfXXN8zPRbMEkFxWqHFOUOgxECJA/exec", TOTAL=21, PASS=80;
const QCOLS=[["Mentalidad %","Mentalidad"],["Captación %","Captación"],["Clientes y comisiones %","Clientes"],["Alquileres %","Alquileres"],["Ventas %","Ventas"],["Sistema %","Sistema"]], NQ=QCOLS.length;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA=[], SHEET="", sortK="Último acceso", sortD=-1;
const fd=v=>{if(!v)return "";const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString("es-PY",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("es-PY",{hour:"2-digit",minute:"2-digit"});};
const nota=v=>v===""||v==null?`<span class="n na">—</span>`:`<span class="n ${+v>=PASS?"ok":"no"}">${v}%</span>`;
async function load(pin){
  const r=await fetch(API+"?pin="+encodeURIComponent(pin)); const d=await r.json();
  if(!d.ok) throw new Error(d.error||"Error");
  DATA=d.asesores||[]; SHEET=d.sheet||""; return d;
}
function draw(){
  const q=$("#q").value.toLowerCase(), f=$("#f").value;
  let L=DATA.filter(a=>(!q||String(a.Asesor).toLowerCase().includes(q))&&(!f||(f==="cert"?a.Certificado:f==="nada"?!(+a["Clases vistas"])&&!+a["Cuestionarios aprobados"]:!a.Certificado&&(+a["Clases vistas"]||+a["Cuestionarios aprobados"]))));
  L.sort((a,b)=>{const x=a[sortK],y=b[sortK];return (x>y?1:x<y?-1:0)*sortD;});
  const n=DATA.length, cert=DATA.filter(a=>a.Certificado).length;
  const avg=n?Math.round(DATA.reduce((s,a)=>s+(+a["Clases vistas"]||0),0)/n/TOTAL*100):0;
  const week=DATA.filter(a=>Date.now()-new Date(a["Último acceso"])<7*864e5).length;
  $("#kpis").innerHTML=`<div class="kpi"><span>Asesores registrados</span><b>${n}</b></div><div class="kpi"><span>Avance promedio</span><b>${avg}%</b></div><div class="kpi"><span>Certificados</span><b>${cert}</b></div><div class="kpi"><span>Activos esta semana</span><b>${week}</b></div>`;
  $("#tb").innerHTML=L.length?L.map(a=>{const c=+a["Clases vistas"]||0;const wa=String(a.WhatsApp||"").replace(/\D/g,"");const waL=wa?(wa.startsWith("0")?"595"+wa.slice(1):wa):"";
    return `<tr><td class="name"><b>${esc(a.Asesor)}</b>${a.WhatsApp?`<small>${esc(a.WhatsApp)}</small> ${waL?`<a href="https://wa.me/${waL}" target="_blank" rel="noopener">WhatsApp ↗</a>`:""}`:""}</td>
    <td><div class="prog"><div class="bar"><i style="width:${c/TOTAL*100}%"></i></div><span>${c}/${TOTAL}</span></div></td>
    ${QCOLS.map(q=>`<td>${nota(a[q[0]])}</td>`).join("")}
    <td><b>${+a["Cuestionarios aprobados"]||0}/${NQ}</b></td>
    <td>${a.Certificado?`<span class="cert">🎓 ${fd(a.Certificado)}</span>`:`<span class="cert na">Pendiente</span>`}</td>
    <td class="muted">${fd(a["Último acceso"])}</td></tr>`}).join(""):`<tr><td colspan="11" class="empty">${DATA.length?"Ningún asesor coincide con el filtro.":"Todavía no se registró ningún asesor. Compartí skyonehome.github.io/grow con tu equipo."}</td></tr>`;
  $("#cards").innerHTML=L.length?L.map(a=>{const c=+a["Clases vistas"]||0;const wa=String(a.WhatsApp||"").replace(/\D/g,"");const waL=wa?(wa.startsWith("0")?"595"+wa.slice(1):wa):"";
    return `<div class="ac"><div class="top"><div><b>${esc(a.Asesor)}</b><small>${esc(a.WhatsApp||"")}</small></div>${waL?`<a href="https://wa.me/${waL}" target="_blank" rel="noopener">WhatsApp ↗</a>`:""}</div>
    <div class="prog"><div class="bar"><i style="width:${c/TOTAL*100}%"></i></div><span>${c}/${TOTAL} clases</span></div>
    <div class="qs">${QCOLS.map(q=>`<div>${q[1]}${nota(a[q[0]])}</div>`).join("")}</div>
    <div class="foot"><span>${a.Certificado?`<span class="cert">🎓 Certificado ${fd(a.Certificado)}</span>`:`Aprobados ${+a["Cuestionarios aprobados"]||0}/${NQ}`}</span><span>Último acceso: ${fd(a["Último acceso"])}</span></div></div>`}).join(""):`<p class="empty">${DATA.length?"Ningún asesor coincide con el filtro.":"Todavía no se registró ningún asesor."}</p>`;
  $("#hR").innerHTML=`${SHEET?`<a class="b" href="${esc(SHEET)}" target="_blank" rel="noopener">Abrir planilla ↗</a>`:""}<button class="b w" id="rf">↻ Actualizar</button><button class="b" id="out">Salir</button>`;
  $("#rf").onclick=async()=>{ $("#rf").textContent="Cargando…"; try{await load(sessionStorage.getItem("growpin"));}catch(e){} draw(); };
  $("#out").onclick=()=>{ try{sessionStorage.removeItem("growpin");}catch(e){} location.reload(); };
}
async function enter(pin){
  $("#gE").textContent="Verificando…";
  try{ await load(pin); try{sessionStorage.setItem("growpin",pin);}catch(e){} $("#gate").hidden=true; $("#app").hidden=false; draw(); }
  catch(e){ $("#gE").textContent=e.message==="PIN incorrecto"?"PIN incorrecto.":"No se pudo conectar. Probá de nuevo."; }
}
$("#gF").addEventListener("submit",e=>{e.preventDefault(); enter($("#pin").value.trim());});
$("#q").addEventListener("input",draw); $("#f").addEventListener("change",draw);
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k; sortD=sortK===k?-sortD:-1; sortK=k; draw();});
let saved=null; try{saved=sessionStorage.getItem("growpin");}catch(e){} if(saved) enter(saved);
</script>
</body>
</html>
