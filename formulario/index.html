<style>
:root{
  /* Layout: cabecera azul, una columna angosta de 760px pensada para el celular, una tarjeta por sección. Colores del manual de marca SkyOne. */
  --blue:#06326b; --blue-soft:#e7eef8; --gray:#798490; --dark:#394049;
  --bg:#f2f5f9; --card:#fff; --line:#dde3ea; --ink:#222a33; --muted:#5d6874;
  --good:#1d7f55; --good-bg:#e4f3ec; --warn:#a56a00; --warn-bg:#fbf0d9; --bad:#b53a2d; --bad-bg:#f9e5e2;
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
h1,h2,h3{margin:0;color:var(--blue);text-wrap:balance}
h2{font-size:20px;font-weight:800} h3{font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--blue);color:#fff}
.top-in{max-width:760px;margin:0 auto;padding:16px 16px 0;display:flex;flex-direction:column;gap:10px}
.top h1{color:#fff;font-size:20px;font-weight:800}
.top p{margin:0;color:#c3d1e6;font-size:14px}
.tabs{display:flex;gap:2px;margin-top:6px}
.tab{color:#cdd8e8;text-decoration:none;padding:9px 14px;border-radius:8px 8px 0 0;font-weight:600;font-size:14px}
.tab.on{background:var(--bg);color:var(--blue)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.opt:focus-within{outline:3px solid #6f9be0;outline-offset:1px}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;gap:10px;align-items:center}
.sec b{background:var(--blue);color:#fff;border-radius:99px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.sub{color:var(--muted);font-size:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--dark)}
label .hint{font-weight:400;color:var(--muted)}
input,select,textarea{border:1px solid #c2cad6;border-radius:10px;padding:11px 12px;background:#fff;width:100%;min-width:0;font-size:16px}
textarea{min-height:84px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid #c2cad6;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;background:#fff;text-align:center}
.opt input{width:auto;accent-color:var(--blue);margin:0}
.opt.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.opt.on.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt.on.yes{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;font-size:16px}
.btn:hover{background:#0a4290}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.sm{padding:6px 12px;font-size:14px}
.note{background:var(--blue-soft);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;font-size:14px}
.note.warn{background:var(--warn-bg);border-color:#d79a1b}
.note.bad{background:var(--bad-bg);border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gray{background:#e9ecf0;color:var(--dark)}
.foot{text-align:center;color:var(--muted);font-size:13px;font-style:italic;padding-top:6px}
.nav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv div{background:#f5f8fc;border-radius:10px;padding:10px}
.kv small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kv b{font-size:20px;color:var(--blue)}
details.r{background:#fff;border:1px solid var(--line);border-radius:12px}
details.r>summary{padding:12px 14px;cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
details.r>summary::-webkit-details-marker{display:none}
details.r[open]>summary{border-bottom:1px solid var(--line)}
details.r .rb{padding:14px;display:flex;flex-direction:column;gap:12px}
.rb h3{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.rb p{margin:2px 0 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
.toast.bad{background:var(--bad)}
ul.tight{margin:4px 0 0;padding-left:20px}
.act{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafd;display:flex;flex-direction:column;gap:10px}
@media(max-width:420px){.opts{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}.g3>label:first-child{grid-column:1/-1}}

/* Tema azul marino: fondo marino profundo, tarjetas marino más claro, letras claras, acento azul brillante y turquesa */
:root{

body{background:radial-gradient(900px 500px at 100% -10%,rgba(47,140,255,.18),transparent 60%),radial-gradient(700px 400px at -10% 20%,rgba(34,211,238,.08),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,h3{color:var(--ink)}
.top{background:transparent;color:var(--ink);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(7,26,58,.82);border-bottom:1px solid var(--line)}

.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .35s ease}
.progT{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
.tab{color:var(--muted)}

.card{background:var(--card);border-color:var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(2,10,28,.45)}
.sec h3{font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
.sec h3:before{content:"";width:4px;height:18px;border-radius:4px;background:linear-gradient(var(--acc),var(--acc2))}
.sub{color:var(--muted)}
label{color:var(--dark);font-weight:600}
label .hint{color:var(--muted)}
input,select,textarea{background:#0a1f44;border:1px solid #24497f;color:var(--ink);border-radius:12px;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#6f86ab}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,140,255,.22)}
select option{background:#0d2650}
.opt{background:#0a1f44;border-color:#24497f;color:var(--dark);border-radius:12px;transition:all .15s}
.opt:hover{border-color:#3b67a8}
.opt.on{background:var(--blue-soft);border-color:var(--acc);color:#fff}
.opt.on.yes{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.on.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn{background:linear-gradient(90deg,var(--acc),#3fa0ff);border:0;color:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(47,140,255,.35)}
.btn:hover{filter:brightness(1.08);background:linear-gradient(90deg,var(--acc),#3fa0ff)}
.btn.ghost{background:transparent;border:1px solid #2f5a96;color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.6}
.note{background:var(--blue-soft);border-left-color:var(--acc);color:var(--ink)}
.note.warn{background:var(--warn-bg);border-color:var(--warn)}
.note.bad{background:var(--bad-bg);border-color:var(--bad)}
.note a,.foot a{color:var(--blue)}
.pill{background:var(--blue-soft);color:var(--blue)}
.pill.gray{background:#15325f;color:var(--dark)}
.kv div{background:#0a1f44;border:1px solid var(--line)}
.kv b{color:#fff}
details.r{background:var(--card);border-color:var(--line)}
details.r>summary b{color:#fff}
.rb h3{color:var(--muted)}
.act{background:#0a1f44;border-color:var(--line)}
.toast{background:#15325f;border:1px solid var(--line)}
.foot{color:var(--muted)}
.opts{grid-template-columns:1fr 1fr!important}.opt input{position:absolute;opacity:0;pointer-events:none}.opt{position:relative;padding:14px}
.done-ic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--good-bg);color:var(--good);font-size:28px;font-weight:800}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const todayStr=()=>ymd(new Date());
const weekLabel=w=>{const a=parse(w),b=parse(addDays(w,6));return a.getMonth()===b.getMonth()?a.getDate()+' al '+b.getDate()+' de '+MES[b.getMonth()]:a.getDate()+' de '+MES[a.getMonth()]+' al '+b.getDate()+' de '+MES[b.getMonth()];};
const monthKey=w=>w.slice(0,7);
const monthLabel=m=>{const p=m.split('-').map(Number);return MES[p[1]-1]+' '+p[0];};
const isLastWeek=w=>addDays(w,7).slice(0,7)!==w.slice(0,7)||addDays(w,6).slice(0,7)!==w.slice(0,7);
let toastT;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3200);}

 1:{sig:'No consigue reuniones con propietarios',rev:'Prospección y primer contacto',act:'Revisar fuentes, mensaje inicial y seguimiento.'},

const TRACKS={
 cap:{name:'Captación de propiedades',stages:[

  ['cap-2','Generar','2. Contactar','Probá otro canal y programá un seguimiento razonable.',1],

  ['cap-4','Contactar','4. Coordinar una reunión de captación','Ofrecé dos horarios específicos y pactá cuándo volver a hablar.',1],
  ['cap-5','Contactar','5. Visitar e inspeccionar la propiedad','Si falta información importante, pedila antes de publicar o comprometer condiciones.',2],
  ['cap-6','Contactar','6. Presentar una estrategia comercial clara','Si no acepta el precio recomendado, mostrá comparables y explicá el efecto de un precio poco competitivo.',2],
  ['cap-7','Convertir','7. Obtener exclusiva o autorización','Identificá la objeción real, resolvé dudas y acordá el siguiente paso sin presionar.',2],
  ['cap-8','Convertir','8. Cargar al sistema y compartir con la red','Completá los datos o el material que falte antes de difundir.',3],
  ['cap-9','Dar seguimiento','9. Publicar e implementar la estrategia','Si no hay consultas, revisá precio, fotos, descripción y canales de difusión.',3],
  ['cap-10','Dar seguimiento','10. Mantener informado al propietario','Si está disconforme, compartí datos concretos, escuchá y acordá una acción y una fecha de seguimiento.',3]]},
 cli:{name:'Seguimiento de compradores e inquilinos',stages:[
  ['cli-1','Contactar','1. Recibir y responder la consulta','Si responde poco, hacé una pregunta concreta y sencilla antes de enviar opciones.',4],
  ['cli-2','Calificar','2. Identificar la necesidad','Pedile que priorice sus tres requisitos principales.',4],
  ['cli-3','Calificar','3. Confirmar presupuesto y forma de pago','Aclará el rango y los requisitos antes de coordinar visitas.',4],
  ['cli-4','Calificar','4. Confirmar plazo y decisores','Acordá el siguiente paso antes de dedicar tiempo a visitas.',4],
  ['cli-5','Proponer','5. Seleccionar y enviar opciones','Si rechaza todas, revisá si la diferencia está en precio, zona, características o expectativas.',4],
  ['cli-6','Visitar','6. Coordinar y confirmar la visita','Si cancela o no confirma, preguntale si mantiene el interés antes de volver a coordinar.',5],
  ['cli-7','Evaluar','7. Recoger comentarios y definir avance','Identificá la objeción concreta y decidí si negociar, buscar otra opción o hacer seguimiento.',5],
  ['cli-8','Negociar','8. Negociar y preparar el cierre','Identificá si el obstáculo es precio, pago, documentación o condiciones.',5],
  ['cli-9','Cerrar y seguir','9. Confirmar los pasos finales','Definí responsable, acción concreta y fecha de seguimiento.',5]]}};
function stageInfo(id){for(const k in TRACKS){const s=TRACKS[k].stages.find(x=>x[0]===id);if(s)return{track:TRACKS[k].name,group:s[1],name:s[2],tip:s[3],sig:SIG[s[4]]};}return null;}

/* estado */
const SB_URL='https://mwmkjalreughugurspsi.supabase.co',SB_KEY='sb_publishable_Ia6_VwQhmApbaCVSEJJesg_f_4sPKwO';
const S={db:null,user:null,uid:'',key:'',myName:'',panelMode:false,isBM:false,tab:'formulario',me:null,rows:[],done:false,loaded:false,saving:false,errs:'',rweek:mondayOf(todayStr())};
const F={};
function blankF(w){return{name:(S.me&&S.me.name)||'',week:w,monthGoal:'',why:'',forWhat:'',weekGoal:'',meetDate:'',hit:'',stuck:'',help:'',doubts:'',track:'none',stage:'',nLeads:'',nCli:'',nVis:'',nCie:'',nCap:'',nextGoal:'',closing:isLastWeek(w),mHit:'',mResult:'',mPct:'',mStuck:'',mPrio:'',a1:'',q1:'',d1:'',a2:'',q2:'',d2:'',a3:'',q3:'',d3:'',r1:'',r2:'',r3:'',nmDate:'',nmTime:''};}
function loadWeek(w){
  const me=S.me||{},wk=(me.weeks||{})[w],mo=(me.months||{})[monthKey(w)]||{},prev=(me.weeks||{})[addDays(w,-7)];
  let draft=null;try{draft=JSON.parse(localStorage.getItem('sk_draft_'+S.uid+'_'+w)||'null');}catch(e){}
  const f=blankF(w);
  f.monthGoal=mo.goal||'';f.why=mo.why||'';f.forWhat=mo.forWhat||'';
  if(prev&&prev.nextGoal)f.weekGoal=prev.nextGoal;
  if(prev&&prev.nextMeeting&&prev.nextMeeting.date)f.meetDate=prev.nextMeeting.date;
  const c=mo.close||{};f.mHit=c.hit||'';f.mResult=c.result||'';f.mPct=c.pct||'';f.mStuck=c.stuck||'';f.mPrio=c.prio||'';
  if(wk)Object.assign(f,{weekGoal:wk.weekGoal||f.weekGoal,meetDate:wk.meetDate||'',hit:wk.hit||'',stuck:wk.stuck||'',help:wk.help||'',doubts:wk.doubts||'',track:wk.track||'none',stage:wk.stage||'',nLeads:wk.n?wk.n.leads:'',nCli:wk.n?wk.n.clientes:'',nVis:wk.n?wk.n.visitas:'',nCie:wk.n?wk.n.cierres:'',nCap:wk.n?wk.n.captaciones:'',nextGoal:wk.nextGoal||'',closing:isLastWeek(w)||!!c.hit},actFields(wk));
  else if(draft)Object.assign(f,draft,{week:w});
  Object.keys(F).forEach(k=>delete F[k]);Object.assign(F,f);
}
function saveDraft(){if(S.isBM)return;try{localStorage.setItem('sk_draft_'+S.uid+'_'+F.week,JSON.stringify(F));}catch(e){}}

/* acciones, reunión y ejemplos */
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const dayLabel=d=>{const x=parse(d);return DIAS[x.getDay()]+' '+x.getDate()+' de '+MES[x.getMonth()];};
const meetingText=(d,t)=>d?dayLabel(d)+(t?' a las '+t:''):'sin fecha';
const DAYN=['lunes','martes','miércoles','jueves','viernes'];
const EX=[
 {t:'Captación: conseguir exclusividades',month:'Conseguir 4 exclusividades firmadas este mes',week:'Conseguir 1 exclusividad firmada esta semana',acts:[['Contactar a 15 propietarios potenciales',15,2],['Agendar 3 reuniones de captación',3,4],['Presentar la estrategia comercial en 2 visitas',2,4]]},
 {t:'Colocación: llegar al cierre',month:'Cerrar 1 operación con comisión cobrada este mes',week:'Hacer 3 visitas con clientes calificados esta semana',acts:[['Confirmar presupuesto y forma de pago de 5 clientes',5,1],['Enviar opciones a 5 clientes',5,2],['Coordinar y confirmar 3 visitas',3,3]]},
 {t:'Publicación y seguimiento: propiedades sin consultas',month:'Que mis 5 propiedades en cartera reciban consultas todas las semanas',week:'Mejorar la publicación de 2 propiedades esta semana',acts:[['Actualizar fotos y descripción de 2 propiedades',2,2],['Compartir 5 propiedades con la red',5,3],['Informar a 5 propietarios sobre consultas y visitas',5,4]]},
 {t:'Asesor nuevo: arrancar fuerte',month:'Terminar mi inducción y conseguir mi primera propiedad en exclusiva',week:'Terminar 2 módulos de inducción y contactar a 10 propietarios',acts:[['Ver 2 módulos de inducción y completar la guía',2,2],['Contactar a 10 propietarios de mi primer anillo de contactos',10,3],['Pedir recomendaciones a 5 conocidos',5,4]]}
];
function actFields(wk){const o={};(wk.actions||[]).forEach((a,i)=>{if(i<3){o['a'+(i+1)]=a.what||'';o['q'+(i+1)]=a.qty;o['d'+(i+1)]=a.due||'';}});(wk.actRes||[]).forEach((x,i)=>{if(i<3)o['r'+(i+1)]=x;});if(wk.nextMeeting){o.nmDate=wk.nextMeeting.date||'';o.nmTime=wk.nextMeeting.time||'';}return o;}
function prevActions(){const p=(S.me&&S.me.weeks||{})[addDays(F.week,-7)];return p&&p.actions?p.actions:[];}
function prevActsHtml(){

/* acceso a datos */
function norm(d){let x=d;if(typeof d.data==='function')x=d.data();else if(d.data&&typeof d.data==='object')x=d.data;return Object.assign({},x,{id:d.id!=null?d.id:x.id});}
function rowsOf(snap){const out=[];const list=snap&&snap.docs?snap.docs:snap;if(list&&typeof list.forEach==='function')list.forEach(d=>out.push(norm(d)));return out;}
async function rpc(fn,args){
  const h={'Content-Type':'application/json',apikey:SB_KEY};if(SB_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SB_KEY;
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j;
}
async function readMe(){
  try{const d=await rpc('skyone_form_me',{p_tel:S.uid});return d&&typeof d==='object'?d:null;}
  catch(e){S.errs=String((e&&e.message)||e);return null;}
}

const waLink=t=>{t=String(t||'').replace(/\D/g,'');if(t.startsWith('0'))t='595'+t.slice(1);return 'https://wa.me/'+t;};

/* render */
function renderTabs(){
  if(!S.isBM){$('#tabs').innerHTML='';return;}
  $('#tabs').innerHTML=[['respuestas','Respuestas'],['formulario','Vista del asesor']].map(x=>'<a class="tab'+(S.tab===x[0]?' on':'')+'" href="#'+x[0]+'">'+x[1]+'</a>').join('')+'<a class="tab" href="#" data-a="reload">Actualizar</a>';
}
function updProg(){
  const w=document.getElementById('progWrap');if(!w)return;
  const show=!!(S.uid&&S.loaded&&!S.done&&!S.isBM&&$('#f_weekGoal'));w.hidden=!show;if(!show)return;
  const t=v=>String(v==null?'':v).trim()!=='';
  const req=[t(F.name),t(F.monthGoal),t(F.weekGoal),t(F.hit),t(F.stuck)||F.hit==='si',t(F.help),t(F.nextGoal),t(F.a1)&&t(F.q1)&&t(F.d1),t(F.nmDate)];
  const p=Math.round(req.filter(Boolean).length/req.length*100);$('#progBar').style.width=p+'%';$('#progN').textContent=p===100?'¡Listo para enviar!':p+'%';
}
function render(){
  renderTabs();const v=$('#view');
  if(S.panelMode&&!S.isBM){v.innerHTML=keyCard();return;}
  if(!S.uid){v.innerHTML=idCard();return;}
  if(!S.loaded){v.innerHTML='<div class="card">Cargando tus datos…</div>';return;}
  setTimeout(updProg,0);
  v.innerHTML=(S.isBM&&S.tab==='respuestas')?vResp():((S.isBM?'':'<div class="note">Completando como <b>'+esc(S.myName||F.name)+'</b> · '+esc(telFmt(S.uid))+' · <a href="#" data-a="logout">No soy yo</a></div>')+vForm());
}
function route(){
  let h=(location.hash||'').slice(1);if(h==='panel'){S.panelMode=true;h='respuestas';}if(!S.isBM)h='formulario';if(h!=='respuestas'&&h!=='formulario')h=S.isBM?'respuestas':'formulario';
  if(h!==S.tab){S.tab=h;S.done=false;}render();
}
window.addEventListener('hashchange',route);

/* eventos */
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(!k||e.target.type==='radio'||e.target.type==='checkbox'||e.target.tagName==='SELECT')return;F[k]=e.target.value;saveDraft();updProg();});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.f;if(!k)return;
  if(e.target.type==='checkbox')F[k]=e.target.checked;else F[k]=e.target.value;

  if(k==='track'){F.stage='';render();saveDraft();return;}

});

    const me=S.me||{weeks:{},months:{}};const w=F.week,mk=monthKey(w);
    const entry={weekGoal:F.weekGoal.trim(),meetDate:F.meetDate,hit:F.hit,stuck:F.stuck.trim(),help:F.help.trim(),doubts:F.doubts.trim(),track:F.track,stage:F.track==='none'?'':F.stage,
      n:{leads:n(F.nLeads),clientes:n(F.nCli),visitas:n(F.nVis),cierres:n(F.nCie),captaciones:n(F.nCap)},nextGoal:F.nextGoal.trim(),actions:[1,2,3].filter(i=>(F['a'+i]||'').trim()&&(parseFloat(F['q'+i])||0)>0).map(i=>({what:F['a'+i].trim(),qty:parseFloat(F['q'+i]),due:F['d'+i]||''})),actRes:prevActions().slice(0,3).map((a,i)=>n(F['r'+(i+1)])),nextMeeting:{date:F.nmDate,time:F.nmTime},submittedAt:new Date().toISOString()};
    const month={goal:F.monthGoal.trim(),why:F.why.trim(),forWhat:F.forWhat.trim()};
    const old=(me.months||{})[mk]||{};
    if(F.closing&&F.mHit)month.close={hit:F.mHit,result:F.mResult.trim(),pct:F.mPct===''?'':n(F.mPct),stuck:F.mStuck.trim(),prio:F.mPrio.trim()};else if(old.close)month.close=old.close;
    const doc={name:F.name.trim(),tel:S.uid,weeks:Object.assign({},me.weeks,{[w]:entry}),months:Object.assign({},me.months,{[mk]:month}),updated:new Date().toISOString()};
    try{await rpc('skyone_form_save',{p_tel:S.uid,p_doc:doc});S.me=doc;try{localStorage.removeItem('sk_draft_'+S.uid+'_'+w);}catch(e){}S.done=true;render();window.scrollTo(0,0);}
    catch(err){toast('No se pudo enviar. Revisá tu conexión y probá de nuevo.',true);}
    S.saving=false;const b2=$('#send');if(b2){b2.disabled=false;}
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a]){if(b.tagName==='A')e.preventDefault();ACT[b.dataset.a](b);}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='id_name'||e.target.id==='id_tel')ACT.ident();if(e.target.id==='k_key')ACT.key();});

(async function init(){
  route();
  if(S.panelMode){let k='';try{k=sessionStorage.getItem('sk_key')||'';}catch(e){}if(k){S.key=k;try{await loadAll();S.isBM=true;S.uid='vista-previa';loadWeek(mondayOf(todayStr()));S.loaded=true;S.tab='';route();}catch(e){}}return;}
  let last=null;try{last=JSON.parse(localStorage.getItem('sk_id')||'null');}catch(e){}
  if(last&&last.tel&&last.name){S.uid=last.tel;S.myName=last.name;render();S.me=(await readMe())||{name:last.name,weeks:{},months:{}};if(S.errs){S.uid='';render();return;}S.me.name=last.name;loadWeek(mondayOf(todayStr()));F.name=last.name;S.loaded=true;}
  render();
})();
</script>
